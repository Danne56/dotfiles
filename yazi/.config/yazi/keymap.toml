[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Jump to repo root"

[[mgr.prepend_keymap]]
on   = [ "e", "u" ]
run  = "plugin docker-compose up"
desc = "Docker Compose Up"

[[mgr.prepend_keymap]]
on   = [ "e", "d" ]
run  = "plugin docker-compose down"
desc = "Docker Compose Down"

[[mgr.prepend_keymap]]
on   = [ "e", "r" ]
run  = "plugin docker-compose restart"
desc = "Docker Compose Restart"

[[mgr.prepend_keymap]]
on = "<A-y>"
run = ["plugin copy-file-contents"]
desc = "Copy contents of file"

[[mgr.prepend_keymap]]
on  = "<C-y>"
run = [ "yank", 'plugin clipboard -- --action=copy' ]

[[mgr.prepend_keymap]]
on  = "<C-p>"
run = [ 'plugin clipboard -- --action=paste' ]

[[mgr.prepend_keymap]]
on = [ "u", "a" ]
run = "plugin yamb -- save"
desc = "Add bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "g" ]
run = "plugin yamb -- jump_by_key"
desc = "Jump bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "G" ]
run = "plugin yamb -- jump_by_fzf"
desc = "Jump bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "u", "d" ]
run = "plugin yamb -- delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "D" ]
run = "plugin yamb -- delete_by_fzf"
desc = "Delete bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "u", "A" ]
run = "plugin yamb -- delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = [ "u", "r" ]
run = "plugin yamb -- rename_by_key"
desc = "Rename bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "R" ]
run = "plugin yamb -- rename_by_fzf"
desc = "Rename bookmark by fzf"

[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "run lazygit"

[[mgr.prepend_keymap]]
on   = [ "g", "z" ]
run  = "plugin ziggity"
desc = "run ziggity"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "plugin lazydocker"
desc = "Run lazydocker"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin zippity -- enter"
desc = "Enter folder or archive; preview member"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin zippity -- auto-preview"
desc = "Toggle archive previews; forward outside archives"

[[mgr.prepend_keymap]]
on = "<Right>"
run = "plugin zippity -- enter"
desc = "Enter folder or archive; preview member"

[[mgr.prepend_keymap]]
on = "h"
run = "plugin zippity -- leave"
desc = "Leave folder or nested archive"

[[mgr.prepend_keymap]]
on = "<Left>"
run = "plugin zippity -- leave"
desc = "Leave folder or nested archive"

[[mgr.prepend_keymap]]
on = "<A-a>"
run = "plugin zippity -- menu"
desc = "Archive actions"

[[mgr.prepend_keymap]]
on = "<A-f>"
run = "plugin zippity -- search"
desc = "Search archive member paths"

[[mgr.prepend_keymap]]
on = "<A-t>"
run = "plugin zippity -- check"
desc = "Verify archive integrity"

[[mgr.prepend_keymap]]
on = "<A-e>"
run = "plugin zippity -- edit"
desc = "Begin archive edit session"

[[mgr.prepend_keymap]]
on = "<A-s>"
run = "plugin zippity -- save"
desc = "Save archive changes"

[[mgr.prepend_keymap]]
on = "<A-d>"
run = "plugin zippity -- discard"
desc = "Discard archive changes"

[[mgr.prepend_keymap]]
on = "<A-n>"
run = "plugin zippity -- create"
desc = "Create archive from selection"

[[mgr.prepend_keymap]]
on = "<A-z>"
run = "plugin zippity -- quick"
desc = "Quick compress with the last settings"

[[mgr.prepend_keymap]]
on = "<A-x>"
run = "plugin zippity -- extract"
desc = "Extract whole archives beside them"

[[mgr.prepend_keymap]]
on = "<A-p>"
run = "plugin zippity -- preview"
desc = "Preview archive member"

[[mgr.prepend_keymap]]
on = "<A-u>"
run = "plugin zippity -- unlock"
desc = "Set archive password"

[[mgr.prepend_keymap]]
on = "<A-l>"
run = "plugin zippity -- lock"
desc = "Forget password and remove member cache"

[[mgr.prepend_keymap]]
on = "p"
run = "plugin zippity -- paste"
desc = "Paste files or extract archive members"

[[mgr.prepend_keymap]]
on = "P"
run = "plugin zippity -- paste-force"
desc = "Paste or extract with overwrite"

[[mgr.prepend_keymap]]
on = "x"
run = "plugin zippity -- cut"
desc = "Cut outside archives"

[[mgr.prepend_keymap]]
on = "q"
run = "plugin zippity -- quit"
desc = "Clean member caches and quit"

[[mgr.prepend_keymap]]
on = "Q"
run = "plugin zippity -- quit-no-cwd"
desc = "Clean member caches and quit without changing directory"
