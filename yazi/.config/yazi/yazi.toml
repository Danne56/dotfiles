[mgr]
show_hidden = true
linemode = "size"

[tasks]
image_alloc = 1073741824

[plugin]
preloaders = []
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
  { url = "zippity://*", run = "zippity", prio = "high", group = "mime" },
]
prepend_previewers = [
  { mime = "zippity/member", run = "zippity" },
]

[opener]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
	{ run = "%EDITOR% %s", block = true, for = "windows" },
]
