theme = "catppuccin_mocha"

[editor]
line-number = "relative"
auto-save = true
bufferline = "multiple"
color-modes = true
true-color = true
insert-final-newline = true
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.gutters]
layout = ["diff", "diagnostics", "line-numbers", "spacer"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎"
skip-levels = 1

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator", "position", "file-line-ending", "file-type"]
right = ["diagnostics", "selections", "register", "file-encoding"]
separator = "│"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[keys.insert]
C-c = "normal_mode"

[keys.normal]
C-s = ":w"
C-q = ":q"
C-x = ":x"
X = ["extend_line_up", "extend_to_line_bounds"]
S-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
S-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
